[project]
name = "mogobe-server"
version = "0.1.0"
description = "Mogobe accounts and original SWF protocol compatibility"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.3,<1",
  "email-validator>=2.2,<3",
  "websockets>=14,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
